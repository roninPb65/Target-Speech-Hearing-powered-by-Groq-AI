<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TGH — Target Speech Hearing</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #060a12;
      --surface: #0c1220;
      --surface2: #111827;
      --border: rgba(0, 229, 255, 0.13);
      --border2: rgba(0, 229, 255, 0.07);
      --cyan: #00e5ff;
      --amber: #ff9500;
      --green: #00ff88;
      --red: #ff3b5c;
      --violet: #a78bfa;
      --text: #ddeeff;
      --text-dim: #5a7a99;
      --font-d: 'Syne', sans-serif;
      --font-m: 'JetBrains Mono', monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font-m);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,229,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,229,255,0.025) 1px, transparent 1px);
      background-size: 44px 44px;
      pointer-events: none;
      z-index: 0;
    }

    .app {
      position: relative;
      z-index: 1;
      max-width: 960px;
      margin: 0 auto;
      padding: 28px 20px 60px;
    }

    /* ── HEADER ─────────────────────────────────────── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }

    .logo-main {
      font-family: var(--font-d);
      font-size: 2.6rem;
      font-weight: 800;
      color: var(--cyan);
      text-shadow: 0 0 40px rgba(0,229,255,0.35);
      letter-spacing: -0.03em;
      line-height: 1;
    }

    .logo-sub {
      font-size: 0.6rem;
      color: var(--text-dim);
      letter-spacing: 0.22em;
      text-transform: uppercase;
      margin-top: 5px;
    }

    .hdr-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
    }

    .status-pill {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 0.7rem;
      color: var(--text-dim);
      letter-spacing: 0.12em;
    }

    .sdot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--text-dim);
    }
    .sdot.live   { background: var(--green);  box-shadow: 0 0 8px var(--green);  animation: blink 1.4s infinite; }
    .sdot.work   { background: var(--amber);  box-shadow: 0 0 8px var(--amber);  animation: blink 0.7s infinite; }
    .sdot.ready  { background: var(--cyan);   box-shadow: 0 0 8px var(--cyan); }
    .sdot.err    { background: var(--red);    box-shadow: 0 0 8px var(--red); }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }

    /* ── PANEL ──────────────────────────────────────── */
    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 14px;
    }

    .plabel {
      font-size: 0.62rem;
      text-transform: uppercase;
      letter-spacing: 0.22em;
      color: var(--cyan);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .plabel::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* ── CONFIG ─────────────────────────────────────── */
    .cfg-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      color: var(--text-dim);
      font-size: 0.72rem;
      background: none;
      border: none;
      padding: 0;
      font-family: var(--font-m);
      margin-bottom: 0;
      transition: color .2s;
    }
    .cfg-toggle:hover { color: var(--cyan); }

    .cfg-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
    }
    @media(max-width:580px){ .cfg-grid{ grid-template-columns:1fr; } }

    .field label {
      display: block;
      font-size: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: var(--text-dim);
      margin-bottom: 5px;
    }
    .field input, .field select {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 9px 12px;
      color: var(--text);
      font-family: var(--font-m);
      font-size: 0.78rem;
      transition: border-color .2s;
    }
    .field input:focus, .field select:focus {
      outline: none;
      border-color: var(--cyan);
    }
    .field input::placeholder { color: var(--text-dim); }
    .field select option { background: #111827; }

    /* ── ERROR ──────────────────────────────────────── */
    .errbar {
      background: rgba(255,59,92,.08);
      border: 1px solid rgba(255,59,92,.25);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.78rem;
      color: var(--red);
      margin-bottom: 14px;
      display: none;
    }
    .errbar.show { display: block; }

    /* ── VISUALIZER ─────────────────────────────────── */
    .viz-wrap {
      position: relative;
      height: 110px;
      background: var(--surface2);
      border: 1px solid var(--border2);
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 14px;
    }
    #vizCanvas { width: 100%; height: 100%; display: block; }
    .viz-idle {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.68rem; color: var(--text-dim);
      letter-spacing: .18em; pointer-events: none;
    }

    /* ── CONTROLS ───────────────────────────────────── */
    .controls {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .btn {
      display: flex; align-items: center; gap: 7px;
      padding: 11px 20px;
      border: none; border-radius: 8px;
      cursor: pointer;
      font-family: var(--font-m);
      font-size: 0.78rem; font-weight: 600;
      transition: all .2s;
      letter-spacing: .05em;
    }
    .btn:disabled { opacity: .3; cursor: not-allowed; }

    .btn-rec {
      background: var(--cyan); color: var(--bg); flex: 1;
    }
    .btn-rec:hover:not(:disabled) {
      background: #33eeff;
      box-shadow: 0 0 22px rgba(0,229,255,.3);
    }
    .btn-rec.recording {
      background: var(--red); color: #fff;
      animation: pulse-r 1.4s infinite;
    }
    @keyframes pulse-r {
      0%,100%{ box-shadow:0 0 0 0 rgba(255,59,92,.4); }
      50%{ box-shadow:0 0 0 8px rgba(255,59,92,0); }
    }

    .btn-sec {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
    }
    .btn-sec:hover:not(:disabled) {
      border-color: var(--amber); color: var(--amber);
    }

    .timer {
      font-size: 1.15rem; color: var(--red);
      letter-spacing: .1em; min-width: 58px;
      text-align: center; display: none;
    }

    /* ── CHANNEL CARDS ──────────────────────────────── */
    .ch-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    @media(max-width:580px){ .ch-grid{ grid-template-columns:1fr; } }

    .ch-card {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      position: relative;
      overflow: hidden;
      transition: border-color .2s, transform .15s;
    }
    .ch-card:hover { border-color: rgba(0,229,255,.22); transform: translateY(-1px); }
    .ch-card::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0;
      height: 2px;
    }
    .ch-card.voice::before  { background: var(--cyan); }
    .ch-card.bass::before   { background: var(--amber); }
    .ch-card.air::before    { background: var(--green); }
    .ch-card.full::before   { background: var(--violet); }

    .ch-meta { margin-bottom: 10px; }
    .ch-id {
      font-size: 0.58rem; color: var(--text-dim);
      letter-spacing: .18em; text-transform: uppercase;
      margin-bottom: 2px;
    }
    .ch-name {
      font-family: var(--font-d);
      font-size: 0.95rem; font-weight: 700;
      color: var(--text); line-height: 1.2;
    }
    .ch-range {
      font-size: 0.62rem; color: var(--text-dim);
      letter-spacing: .05em; margin-top: 2px;
    }

    .ch-wf {
      width: 100%; height: 38px;
      border-radius: 4px;
      margin-bottom: 10px;
      background: rgba(0,0,0,.2);
    }

    .ch-loading {
      height: 38px; margin-bottom: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: .62rem; color: var(--text-dim);
      gap: 6px;
    }

    .ch-btns { display: flex; gap: 6px; }

    .cbtn {
      flex: 1;
      display: flex; align-items: center; justify-content: center; gap: 5px;
      padding: 7px 8px;
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      font-family: var(--font-m);
      font-size: 0.68rem;
      background: transparent; color: var(--text-dim);
      transition: all .2s;
    }
    .cbtn:hover:not(:disabled) { border-color: var(--cyan); color: var(--cyan); background: rgba(0,229,255,.05); }
    .cbtn.dl { border-color: rgba(0,229,255,.25); color: var(--cyan); }
    .cbtn.dl:hover { background: rgba(0,229,255,.08); }
    .cbtn:disabled { opacity: .35; cursor: not-allowed; }

    /* ── AI SOURCES ─────────────────────────────────── */
    .ai-item {
      display: flex; align-items: flex-start; gap: 12px;
      padding: 12px 14px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 8px;
    }
    .ai-icon { font-size: 1.4rem; width: 32px; text-align: center; flex-shrink: 0; }
    .ai-info { flex: 1; }
    .ai-name {
      font-family: var(--font-d);
      font-size: .88rem; font-weight: 700;
      color: var(--text); margin-bottom: 2px;
    }
    .ai-desc { font-size: .73rem; color: var(--text-dim); line-height: 1.5; }
    .ai-badge {
      font-size: .58rem; text-transform: uppercase;
      letter-spacing: .14em; padding: 3px 8px;
      border-radius: 20px; white-space: nowrap; align-self: flex-start;
    }
    .b-voice { background: rgba(0,229,255,.1); color: var(--cyan); }
    .b-music { background: rgba(167,139,250,.1); color: var(--violet); }
    .b-environment { background: rgba(0,255,136,.1); color: var(--green); }
    .b-noise { background: rgba(255,149,0,.1); color: var(--amber); }

    .spin {
      width: 15px; height: 15px;
      border: 2px solid rgba(0,229,255,.15);
      border-top-color: var(--cyan);
      border-radius: 50%;
      animation: spin .7s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to{ transform:rotate(360deg); } }

    .analyzing {
      display: flex; align-items: center; gap: 10px;
      padding: 14px; font-size: .78rem; color: var(--text-dim);
    }

    
/* Rich source cards */
.src-card {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 10px;
  margin-bottom: 10px;
  overflow: hidden;
  transition: border-color .2s;
}
.src-card:hover { border-color: rgba(0,229,255,.25); }

.src-card-top {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 14px 14px 10px;
}
.src-icon { font-size: 1.5rem; width: 34px; text-align: center; flex-shrink: 0; margin-top: 2px; }
.src-main { flex: 1; }
.src-header { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; flex-wrap: wrap; }
.src-name {
  font-family: var(--font-d);
  font-size: .92rem; font-weight: 700;
  color: var(--text);
}
.src-badge {
  font-size: .58rem; text-transform: uppercase;
  letter-spacing: .14em; padding: 2px 8px;
  border-radius: 20px; white-space: nowrap;
}
.b-voice { background: rgba(0,229,255,.1); color: var(--cyan); }
.b-music { background: rgba(167,139,250,.1); color: var(--violet); }
.b-environment { background: rgba(0,255,136,.1); color: var(--green); }
.b-noise { background: rgba(255,149,0,.1); color: var(--amber); }

.src-desc {
  font-size: .76rem; color: var(--text-dim);
  line-height: 1.55; margin-bottom: 8px;
}

.src-tags {
  display: flex; flex-wrap: wrap; gap: 5px;
}
.src-tag {
  display: flex; align-items: center; gap: 4px;
  font-size: .64rem;
  background: rgba(255,255,255,.04);
  border: 1px solid rgba(255,255,255,.07);
  border-radius: 5px;
  padding: 3px 8px;
  color: var(--text-dim);
}
.src-tag b { color: var(--text); font-weight: 600; }

.src-quote {
  font-size: .72rem;
  color: var(--text-dim);
  font-style: italic;
  padding: 8px 14px 12px 60px;
  line-height: 1.55;
  border-top: 1px solid var(--border2);
  position: relative;
}
.src-quote::before {
  content: '"';
  position: absolute; left: 36px; top: 4px;
  font-size: 1.8rem; color: var(--cyan); opacity: .25;
  font-family: Georgia, serif; line-height: 1;
}

.src-topics {
  padding: 8px 14px 12px 60px;
  border-top: 1px solid var(--border2);
  display: flex; flex-wrap: wrap; gap: 5px;
}
.topic-chip {
  font-size: .62rem;
  background: rgba(0,229,255,.06);
  border: 1px solid rgba(0,229,255,.12);
  border-radius: 4px;
  padding: 2px 8px;
  color: var(--cyan);
}

.meta-row {
  display: flex; gap: 6px; flex-wrap: wrap;
  padding: 8px 14px;
  border-top: 1px solid var(--border2);
  background: rgba(0,0,0,.15);
}
.meta-pill {
  font-size: .62rem;
  padding: 3px 9px;
  border-radius: 20px;
  background: rgba(255,255,255,.04);
  border: 1px solid rgba(255,255,255,.06);
  color: var(--text-dim);
}
.meta-pill span { color: var(--text); }

.ai-summary {
      font-size: .78rem; color: var(--text-dim);
      padding: 12px 14px; margin-bottom: 10px;
      border: 1px solid var(--border); border-radius: 8px;
      line-height: 1.65;
      background: rgba(0,229,255,.02);
    }

    /* ── TRANSCRIPTION ──────────────────────────────── */
    .tbox {
      background: var(--surface2);
      border: 1px solid var(--border2);
      border-radius: 8px;
      padding: 16px;
      min-height: 90px; max-height: 210px;
      overflow-y: auto;
      font-size: .83rem; line-height: 1.75;
      color: var(--text); white-space: pre-wrap;
    }
    .tbox:empty::before {
      content: 'Awaiting audio input...';
      color: var(--text-dim); font-style: italic;
    }

    /* ── SOURCES SECTION ────────────────────────────── */
    .sources-sec { display: none; }
    .sources-sec.visible { display: block; }

    /* ── SCROLLBAR ──────────────────────────────────── */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: var(--surface2); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(0,229,255,.25); }
  </style>
</head>
<body>
<div class="app">

  <!-- HEADER -->
  <div class="header">
    <div>
      <div class="logo-main">TGH</div>
      <div class="logo-sub">Target Speech Hearing System</div>
    </div>
    <div class="hdr-right">
      <div class="status-pill">
        <div class="sdot" id="sdot"></div>
        <span id="stxt">STANDBY</span>
      </div>
    </div>
  </div>

  <!-- CONFIG -->
  <div class="panel">
    <button class="cfg-toggle" onclick="toggleCfg()">
      ⚙ CONFIGURATION <span id="cfgIcon">▾</span>
    </button>
    <div id="cfgPanel">
      <div class="cfg-grid">
        <div class="field">
          <label>Groq API Key <span style="opacity:.5">(transcription + analysis)</span></label>
          <input type="password" id="groqKey" placeholder="gsk_..." value="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" />
        </div>
        <div class="field">
          <label>Cerebras API Key <span style="opacity:.5">(better multi-speaker analysis)</span></label>
          <input type="password" id="cerebrasKey" placeholder="csk-..." value="csk-cr3jrcvxpn88ndf4crykt3vd9tnnc6xh569m6e42pf666cdk" />
        </div>
        <div class="field">
          <label>Analysis Provider</label>
          <select id="providerSel" onchange="updateModelList()">
            <option value="cerebras">Cerebras (Recommended)</option>
            <option value="groq">Groq</option>
          </select>
        </div>
        <div class="field">
          <label>Analysis Model</label>
          <select id="analysisMdl">
            <option value="llama3.1-70b" selected>Llama 3.1 70B — Best accuracy</option>
            <option value="llama3.1-8b">Llama 3.1 8B — Fastest</option>
          </select>
        </div>
        <div class="field">
          <label>Transcription Model</label>
          <select id="modelSel">
            <option value="whisper-large-v3-turbo" selected>Whisper Large v3 Turbo (Faster)</option>
            <option value="whisper-large-v3">Whisper Large v3 (Best Quality)</option>
          </select>
        </div>
        <div class="field">
          <label>Language</label>
          <select id="langSel">
            <option value="en">English</option>
            <option value="es">Spanish</option>
            <option value="fr">French</option>
            <option value="de">German</option>
            <option value="zh">Chinese</option>
            <option value="ja">Japanese</option>
            <option value="ar">Arabic</option>
            <option value="">Auto-detect</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <!-- ERROR -->
  <div class="errbar" id="errbar"></div>

  <!-- RECORDER -->
  <div class="panel">
    <div class="plabel">Audio Input</div>
    <div class="viz-wrap">
      <canvas id="vizCanvas"></canvas>
      <div class="viz-idle" id="vizIdle">── AWAITING INPUT ──</div>
    </div>
    <div class="controls">
      <button class="btn btn-rec" id="recBtn" onclick="toggleRec()">
        <span id="recIcon">●</span>
        <span id="recLbl">RECORD</span>
      </button>
      <button class="btn btn-sec" id="stopBtn" disabled onclick="stopRec()">■ STOP</button>
      <div class="timer" id="timer">00:00</div>
      <button class="btn btn-sec" onclick="clearAll()">✕ CLEAR</button>
    </div>
  </div>

  <!-- SOURCES SECTION -->
  <div class="sources-sec" id="sourcesSec">

    <!-- FREQUENCY CHANNELS -->
    <div class="panel">
      <div class="plabel">Frequency Channels — Download Individual Tracks</div>
      <div class="ch-grid" id="chGrid"></div>
    </div>

    <!-- AI ANALYSIS -->
    <div class="panel">
      <div class="plabel">AI Sound Source Identification — Powered by Groq</div>
      <div id="aiContent">
        <div class="analyzing"><div class="spin"></div>Analyzing audio sources with Groq AI…</div>
      </div>
    </div>

  </div>

  <!-- TRANSCRIPTION -->
  <div class="panel">
    <div class="plabel">Transcription Output</div>
    <div class="tbox" id="tbox"></div>
  </div>

</div>

<script>
// ── GLOBALS ──────────────────────────────────────────────────────────────
let mediaRec, chunks = [], stream;
let audCtx, analyser, vizFrame;
let timerIv, timerSec = 0;
let cfgVisible = true;

const $ = id => document.getElementById(id);
const canvas = $('vizCanvas');
const ctx2d = canvas.getContext('2d');

// ── STORAGE ──────────────────────────────────────────────────────────────
$('groqKey').value     = localStorage.getItem('tgh_groq') || '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';
$('cerebrasKey').value = localStorage.getItem('tgh_cerebras') || '';
$('providerSel').value = localStorage.getItem('tgh_provider') || 'cerebras';
$('groqKey').addEventListener('change',     e => localStorage.setItem('tgh_groq',      e.target.value));
$('cerebrasKey').addEventListener('change', e => localStorage.setItem('tgh_cerebras',  e.target.value));
$('providerSel').addEventListener('change', e => localStorage.setItem('tgh_provider',  e.target.value));
updateModelList();

// ── MODEL LIST ────────────────────────────────────────────────────────────
function updateModelList() {
  const provider = $('providerSel').value;
  const sel = $('analysisMdl');
  sel.innerHTML = provider === 'cerebras'
    ? `<option value="llama3.1-70b" selected>Llama 3.1 70B — Best accuracy</option>
       <option value="llama3.1-8b">Llama 3.1 8B — Fastest</option>`
    : `<option value="llama-3.3-70b-versatile" selected>Llama 3.3 70B Versatile</option>
       <option value="llama3-8b-8192">Llama 3 8B</option>
       <option value="mixtral-8x7b-32768">Mixtral 8x7B</option>
       <option value="gemma2-9b-it">Gemma 2 9B</option>`;
}


// ── CONFIG TOGGLE ────────────────────────────────────────────────────────
function toggleCfg() {
  cfgVisible = !cfgVisible;
  $('cfgPanel').style.display = cfgVisible ? '' : 'none';
  $('cfgIcon').textContent = cfgVisible ? '▾' : '▸';
}

// ── STATUS ───────────────────────────────────────────────────────────────
function setStatus(text, state) {
  $('stxt').textContent = text;
  const d = $('sdot');
  d.className = 'sdot' + (state ? ' ' + state : '');
}

function showErr(msg) {
  const el = $('errbar');
  el.textContent = '⚠ ' + msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 7000);
}

// ── TIMER ────────────────────────────────────────────────────────────────
function startTimer() {
  timerSec = 0;
  $('timer').style.display = '';
  timerIv = setInterval(() => {
    timerSec++;
    $('timer').textContent =
      String(Math.floor(timerSec/60)).padStart(2,'0') + ':' +
      String(timerSec%60).padStart(2,'0');
  }, 1000);
}
function stopTimer() {
  clearInterval(timerIv);
  $('timer').style.display = 'none';
}

// ── CANVAS VIZ ───────────────────────────────────────────────────────────
function resizeCv() {
  const dpr = devicePixelRatio || 1;
  canvas.width  = canvas.offsetWidth  * dpr;
  canvas.height = canvas.offsetHeight * dpr;
  ctx2d.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function drawIdle() {
  resizeCv();
  const W = canvas.offsetWidth, H = canvas.offsetHeight;
  ctx2d.clearRect(0,0,W,H);
  ctx2d.strokeStyle = 'rgba(0,229,255,0.12)';
  ctx2d.lineWidth = 1;
  ctx2d.beginPath();
  ctx2d.moveTo(0, H/2); ctx2d.lineTo(W, H/2);
  ctx2d.stroke();
}

function drawLive() {
  if (!analyser) return;
  const W = canvas.offsetWidth, H = canvas.offsetHeight;
  const buf = new Uint8Array(analyser.frequencyBinCount);
  analyser.getByteFrequencyData(buf);
  ctx2d.clearRect(0,0,W,H);
  const bw = (W / buf.length) * 2.6;
  let x = 0;
  for (let i = 0; i < buf.length; i++) {
    const v = buf[i]/255;
    const bh = v * H;
    const g = ctx2d.createLinearGradient(0, H-bh, 0, H);
    g.addColorStop(0, `rgba(0,229,255,${v*0.85})`);
    g.addColorStop(1, `rgba(0,229,255,0.08)`);
    ctx2d.fillStyle = g;
    ctx2d.fillRect(x, H-bh, bw-1, bh);
    x += bw;
  }
  vizFrame = requestAnimationFrame(drawLive);
}

// ── RECORD ───────────────────────────────────────────────────────────────
async function toggleRec() {
  if (mediaRec && mediaRec.state === 'recording') { stopRec(); return; }
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    audCtx = new AudioContext();
    const src = audCtx.createMediaStreamSource(stream);
    analyser = audCtx.createAnalyser();
    analyser.fftSize = 512;
    src.connect(analyser);

    $('vizIdle').style.display = 'none';
    resizeCv(); drawLive();

    const mime = ['audio/webm;codecs=opus','audio/ogg;codecs=opus','audio/mp4','audio/webm']
      .find(t => MediaRecorder.isTypeSupported(t)) || '';
    mediaRec = new MediaRecorder(stream, mime ? { mimeType: mime } : {});
    chunks = [];
    mediaRec.ondataavailable = e => chunks.push(e.data);
    mediaRec.onstop = async () => {
      const blob = new Blob(chunks, { type: mediaRec.mimeType });
      stream.getTracks().forEach(t => t.stop());
      cancelAnimationFrame(vizFrame);
      drawIdle();
      $('vizIdle').style.display = '';
      await processAudio(blob);
    };

    mediaRec.start(100);
    startTimer();
    setStatus('RECORDING', 'live');
    $('recBtn').classList.add('recording');
    $('recIcon').textContent = '■';
    $('recLbl').textContent  = 'STOP REC';
    $('stopBtn').disabled = false;

  } catch(e) {
    showErr('Microphone error: ' + e.message);
  }
}

function stopRec() {
  if (mediaRec && mediaRec.state === 'recording') {
    mediaRec.stop();
    stopTimer();
    setStatus('PROCESSING', 'work');
    $('recBtn').classList.remove('recording');
    $('recIcon').textContent = '●';
    $('recLbl').textContent  = 'RECORD';
    $('recBtn').disabled = true;
    $('stopBtn').disabled = true;
  }
}

function clearAll() {
  $('tbox').textContent = '';
  $('sourcesSec').classList.remove('visible');
  $('chGrid').innerHTML = '';
  $('aiContent').innerHTML = '<div class="analyzing"><div class="spin"></div>Analyzing audio sources with Groq AI…</div>';
  setStatus('STANDBY', '');
  $('recBtn').disabled = false;
}

// ── PROCESS PIPELINE ─────────────────────────────────────────────────────
async function processAudio(blob) {
  $('sourcesSec').classList.add('visible');
  buildChannelSkeleton();

  const [transcription] = await Promise.all([
    transcribeGroq(blob),
    separateFreqs(blob)
  ]);

  if (transcription) {
    await analyzeWithClaude(transcription);
  } else {
    showAiFallback('No transcription available for AI source analysis.');
  }

  setStatus('READY', 'ready');
  $('recBtn').disabled = false;
}

// ── GROQ TRANSCRIPTION ────────────────────────────────────────────────────
async function transcribeGroq(blob) {
  const key = $('groqKey').value.trim();
  if (!key) { showErr('Groq API key required for transcription'); return null; }

  try {
    const form = new FormData();
    form.append('file', blob, 'audio.webm');
    form.append('model', $('modelSel').value);
    form.append('response_format', 'json');
    const lang = $('langSel').value;
    if (lang) form.append('language', lang);

    const res = await fetch('https://api.groq.com/openai/v1/audio/transcriptions', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + key },
      body: form
    });

    if (!res.ok) {
      const err = await res.json();
      throw new Error(err.error?.message || 'Transcription failed');
    }

    const data = await res.json();
    if (data.text) {
      const ts = new Date().toLocaleTimeString();
      $('tbox').textContent += `[${ts}] ${data.text}\n\n`;
      $('tbox').scrollTop = $('tbox').scrollHeight;
      return data.text;
    }
    return null;
  } catch(e) {
    showErr('Transcription: ' + e.message);
    return null;
  }
}

// ── FREQUENCY SEPARATION ──────────────────────────────────────────────────
const CHANNELS = [
  {
    id: 'CH.01', slot: 'voice',
    name: 'Voice Band',
    range: '300 Hz – 3.4 kHz',
    icon: '🗣️',
    desc: 'Human speech frequencies, filtered to isolate vocal content',
    filter: { type: 'bandpass', freq: 1500, Q: 0.65 },
    file: 'voice-band.wav',
    color: '#00e5ff'
  },
  {
    id: 'CH.02', slot: 'bass',
    name: 'Sub / Bass',
    range: '< 250 Hz',
    icon: '🔉',
    desc: 'Low-frequency content — rumble, bass, environmental hum',
    filter: { type: 'lowpass', freq: 250, Q: 0.8 },
    file: 'sub-bass.wav',
    color: '#ff9500'
  },
  {
    id: 'CH.03', slot: 'air',
    name: 'Air / Presence',
    range: '> 5 kHz',
    icon: '🌬️',
    desc: 'High-frequency content — sibilance, hiss, ambience, brilliance',
    filter: { type: 'highpass', freq: 5000, Q: 0.8 },
    file: 'air-presence.wav',
    color: '#00ff88'
  },
  {

    icon: '📻',
    desc: 'Unprocessed original recording — all frequencies intact',
    filter: null,
    file: 'full-mix.wav',
    color: '#a78bfa'
  }
];

function buildChannelSkeleton() {
  $('chGrid').innerHTML = CHANNELS.map(ch => `
    <div class="ch-card ${ch.slot}" id="card-${ch.slot}">
      <div class="ch-meta">
        <div class="ch-id">${ch.icon} ${ch.id}</div>
        <div class="ch-name">${ch.name}</div>
        <div class="ch-range">${ch.range}</div>
      </div>
      <div class="ch-loading" id="wfload-${ch.slot}">
        <div class="spin"></div> <span>Rendering…</span>
      </div>
      <canvas class="ch-wf" id="wf-${ch.slot}" style="display:none" height="38"></canvas>
      <div class="ch-btns">
        <button class="cbtn" id="play-${ch.slot}" disabled>▶ PLAY</button>
        <button class="cbtn dl" id="dl-${ch.slot}" disabled>↓ WAV</button>
      </div>
    </div>
  `).join('');
}

async function separateFreqs(blob) {
  let audioBuf;
  try {
    const arr = await blob.arrayBuffer();
    const tmp = new AudioContext();
    audioBuf = await tmp.decodeAudioData(arr);
    await tmp.close();
  } catch(e) {
    showErr('Audio decode failed — frequency separation unavailable');
    CHANNELS.forEach(ch => {
      $('wfload-' + ch.slot).textContent = 'Unavailable';
    });
    return;
  }

  for (const ch of CHANNELS) {
    try {
      let rendered;
      if (ch.filter) {
        const oCtx = new OfflineAudioContext(
          audioBuf.numberOfChannels, audioBuf.length, audioBuf.sampleRate
        );
        const src = oCtx.createBufferSource();
        src.buffer = audioBuf;
        const filt = oCtx.createBiquadFilter();
        filt.type = ch.filter.type;
        filt.frequency.value = ch.filter.freq;
        filt.Q.value = ch.filter.Q;
        src.connect(filt);
        filt.connect(oCtx.destination);
        src.start();
        rendered = await oCtx.startRendering();
      } else {
        rendered = audioBuf;
      }

      const wavBlob = bufToWav(rendered);
      const url = URL.createObjectURL(wavBlob);

      // Draw waveform
      $('wfload-' + ch.slot).style.display = 'none';
      const wfc = $('wf-' + ch.slot);
      wfc.style.display = 'block';
      drawWaveform(wfc, rendered, ch.color);

      // Wire buttons
      let audio = null;
      const playBtn = $('play-' + ch.slot);
      const dlBtn   = $('dl-'   + ch.slot);
      playBtn.disabled = false;
      dlBtn.disabled   = false;

      playBtn.onclick = () => {
        if (audio && !audio.paused) {
          audio.pause(); audio.currentTime = 0;
          playBtn.textContent = '▶ PLAY';
        } else {
          if (audio) { audio.pause(); }
          audio = new Audio(url);
          audio.play();
          playBtn.textContent = '⏸ STOP';
          audio.onended = () => { playBtn.textContent = '▶ PLAY'; };
        }
      };
      dlBtn.onclick = () => {
        const a = document.createElement('a');
        a.href = url; a.download = ch.file; a.click();
      };

    } catch(e) {
      console.warn('Channel', ch.id, 'failed:', e);
      $('wfload-' + ch.slot).innerHTML = '<span style="color:var(--red)">Failed</span>';
    }
  }
}

// ── WAV ENCODER ───────────────────────────────────────────────────────────
function bufToWav(buf) {
  const nc = buf.numberOfChannels, sr = buf.sampleRate, len = buf.length, bps = 2;
  const dl = len * nc * bps;
  const ab = new ArrayBuffer(44 + dl);
  const v  = new DataView(ab);
  const ws = (o, s) => { for(let i=0;i<s.length;i++) v.setUint8(o+i, s.charCodeAt(i)); };
  ws(0,'RIFF'); v.setUint32(4, 36+dl, true);
  ws(8,'WAVE'); ws(12,'fmt '); v.setUint32(16,16,true);
  v.setUint16(20,1,true); v.setUint16(22,nc,true);
  v.setUint32(24,sr,true); v.setUint32(28,sr*nc*bps,true);
  v.setUint16(32,nc*bps,true); v.setUint16(34,16,true);
  ws(36,'data'); v.setUint32(40,dl,true);
  let off = 44;
  for (let i=0; i<len; i++) {
    for (let c=0; c<nc; c++) {
      const s = Math.max(-1, Math.min(1, buf.getChannelData(c)[i]));
      v.setInt16(off, s < 0 ? s*0x8000 : s*0x7FFF, true);
      off += 2;
    }
  }
  return new Blob([ab], { type: 'audio/wav' });
}

// ── WAVEFORM PAINTER ──────────────────────────────────────────────────────
function drawWaveform(c, buf, color) {
  const dpr = devicePixelRatio || 1;
  c.width  = c.offsetWidth * dpr || 280 * dpr;
  c.height = 38 * dpr;
  const cx = c.getContext('2d');
  cx.scale(dpr, dpr);
  const W = c.offsetWidth || 280, H = 38;
  const data = buf.getChannelData(0);
  const step = Math.max(1, Math.floor(data.length / W));

  cx.strokeStyle = color;
  cx.lineWidth = 1.2;
  cx.globalAlpha = 0.75;
  cx.beginPath();
  for (let x = 0; x < W; x++) {
    let mn = 1, mx = -1;
    for (let j = 0; j < step; j++) {
      const s = data[x*step+j] || 0;
      if (s < mn) mn = s; if (s > mx) mx = s;
    }
    cx.moveTo(x, ((1+mn)/2)*H);
    cx.lineTo(x, ((1+mx)/2)*H);
  }
  cx.stroke();

  // center line
  cx.globalAlpha = 0.15;
  cx.beginPath();
  cx.moveTo(0,H/2); cx.lineTo(W,H/2);
  cx.stroke();
}

// ── JSON EXTRACTION HELPER ───────────────────────────────────────────────
function extractJSON(raw) {
  // Strip markdown fences
  let text = raw.replace(/```json|```/g, '').trim();
  // Find outermost { ... }
  const start = text.indexOf('{');
  const end   = text.lastIndexOf('}');
  if (start === -1 || end === -1) return null;
  text = text.slice(start, end + 1);
  // Clean parse
  try { return JSON.parse(text); } catch(_) {}
  // Sanitize: control chars, smart quotes, trailing commas
  text = text
    .replace(/[\x00-\x1F\x7F]/g, ' ')
    .replace(/[\u201C\u201D]/g, '"')
    .replace(/[\u2018\u2019]/g, "\'")
    .replace(/,\s*([}\]])/g, '$1');
  try { return JSON.parse(text); } catch(_) {}
  // Manual extraction fallback
  try {
    const sm = text.match(/"sources"\s*:\s*(\[[\s\S]*?\])/);
    const mm = text.match(/"summary"\s*:\s*"((?:[^"\\]|\\.)*)"/);
    const cm = text.match(/"speakerCount"\s*:\s*(\d+)/);
    if (!sm) return null;
    return {
      sources: JSON.parse(sm[1]),
      summary: mm ? mm[1] : '',
      speakerCount: cm ? parseInt(cm[1]) : 1
    };
  } catch(_) { return null; }
}

// ── AI ANALYSIS (Groq or Cerebras) ───────────────────────────────────────
async function analyzeWithClaude(transcription) {
  const provider = $('providerSel').value;
  const model    = $('analysisMdl').value;
  const key      = provider === 'cerebras'
    ? $('cerebrasKey').value.trim()
    : $('groqKey').value.trim();
  const endpoint = provider === 'cerebras'
    ? 'https://api.cerebras.ai/v1/chat/completions'
    : 'https://api.groq.com/openai/v1/chat/completions';

  if (!key) {
    showAiFallback(`${provider === 'cerebras' ? 'Cerebras' : 'Groq'} API key required. Add it in Configuration above.`);
    return;
  }

  // Update panel label to show active provider
  const panelLabel = document.querySelector('#sourcesSec .panel:last-child .plabel');
  if (panelLabel) panelLabel.textContent = `AI Sound Source Identification — ${provider === 'cerebras' ? 'Cerebras' : 'Groq'} · ${model}`;

  const safeText = transcription.slice(0, 3500).replace(/"/g, "'").replace(/[\x00-\x1F]/g, ' ');

  // Count rough word groups to hint at conversation density
  const wordCount = safeText.split(/\s+/).length;
  const turnHint  = wordCount > 200
    ? 'This is a multi-turn conversation — look carefully for speaker changes indicated by topic shifts, question-answer pairs, different vocabulary, and conversational hand-offs.'
    : 'Analyze carefully for any speaker variety.';

  const systemMsg = `You are an expert forensic audio analyst specialising in speaker diarisation and acoustic scene analysis.
Your job is to identify EVERY distinct voice and sound source — even if the transcription has no speaker labels.
You MUST output only a single valid JSON object. No prose, no markdown, no explanation before or after the JSON.`;

  const userMsg = `TASK: Deeply analyse the transcription below and identify ALL distinct sound sources.

CRITICAL RULES FOR SPEAKER DETECTION:
- Assume there may be 2–6 different speakers even if the text has no labels
- ${turnHint}
- Clues for different speakers: topic changes, question vs answer, formal vs informal style, first-person shifts (I vs you), names being addressed, interruptions, "as I said" / "you mentioned" patterns
- Give each identified speaker a meaningful label based on their ROLE or CONTENT (e.g. "Interviewer", "Technical Expert", "Customer", "Host") — not just "Speaker 1"
- If you are confident a single person spoke, say so; do not fabricate speakers
- Also identify any non-voice sounds: music, ambient noise, keyboard, laughter, applause, etc.

OUTPUT — return ONLY this JSON, nothing else:
{
  "sources": [
    {
      "name": "descriptive role label",
      "type": "voice",
      "icon": "single emoji",
      "description": "what this person says and their conversational role",
      "tone": "vocal quality e.g. calm, assertive, hesitant",
      "pace": "speaking pace e.g. rapid, deliberate, varied",
      "emotion": "emotional state e.g. enthusiastic, nervous, neutral",
      "dominance": "share of speaking time e.g. primary ~45%",
      "topics": ["main topic 1", "main topic 2", "main topic 3"],
      "quote": "verbatim excerpt that best represents this speaker"
    }
  ],
  "speakerCount": 2,
  "audioQuality": "clear / muffled / noisy / distant / echo",
  "backgroundNoise": "concise description of acoustic environment",
  "summary": "detailed 3-sentence summary covering: who is speaking, what is discussed, and the conversational dynamic"
}

For non-voice sources replace voice fields with: intensity (soft/moderate/loud), occurrence (continuous/intermittent/briefly), character (describe the sound).
Keep every string value under 130 chars. Never use double-quote characters inside any string value.

TRANSCRIPTION:
${safeText}`;

  try {
    const res = await fetch(endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key },
      body: JSON.stringify({
        model,
        max_tokens: 2000,
        temperature: 0.15,
        messages: [
          { role: 'system', content: systemMsg },
          { role: 'user',   content: userMsg   }
        ]
      })
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error?.message || `HTTP ${res.status} from ${provider}`);
    }

    const data     = await res.json();
    const raw      = data.choices?.[0]?.message?.content || '';
    const analysis = extractJSON(raw);
    if (!analysis) throw new Error('Could not parse AI response — try again');
    renderAiSources(analysis, provider);

  } catch(e) {
    console.warn('AI analysis failed:', e);
    showAiFallback(`Analysis failed (${provider}): ${e.message}`);
  }
}

function renderAiSources(analysis, provider) {
  let html = '';

  // Summary + meta row
  if (analysis.summary || analysis.audioQuality || analysis.backgroundNoise) {
    let metaHtml = '';
    if (analysis.audioQuality)   metaHtml += `<div class="meta-pill">Quality: <span>${analysis.audioQuality}</span></div>`;
    if (analysis.backgroundNoise) metaHtml += `<div class="meta-pill">Environment: <span>${analysis.backgroundNoise}</span></div>`;
    if (analysis.speakerCount)   metaHtml += `<div class="meta-pill">Speakers: <span>${analysis.speakerCount}</span></div>`;
    if (provider) metaHtml += `<div class="meta-pill" style="border-color:rgba(0,229,255,.2);color:var(--cyan)">via <span style="color:var(--cyan)">${provider === 'cerebras' ? '🧠 Cerebras' : '⚡ Groq'}</span></div>`;

    html += `<div class="ai-summary">${analysis.summary || ''}</div>`;
    if (metaHtml) html += `<div class="meta-row" style="margin-bottom:10px;border-radius:8px;border:1px solid var(--border);">${metaHtml}</div>`;
  }

  if (analysis.sources?.length) {
    analysis.sources.forEach(s => {
      const type  = s.type || 'noise';
      const badge = `b-${type}`;
      const label = type.toUpperCase();
      const isVoice = type === 'voice';

      // Build tags row
      let tags = '';
      if (isVoice) {
        if (s.tone)       tags += `<div class="src-tag">🎭 <b>Tone</b> ${s.tone}</div>`;
        if (s.pace)       tags += `<div class="src-tag">⏱ <b>Pace</b> ${s.pace}</div>`;
        if (s.emotion)    tags += `<div class="src-tag">💬 <b>Emotion</b> ${s.emotion}</div>`;
        if (s.dominance)  tags += `<div class="src-tag">📊 <b>Share</b> ${s.dominance}</div>`;
      } else {
        if (s.intensity)  tags += `<div class="src-tag">🔊 <b>Level</b> ${s.intensity}</div>`;
        if (s.occurrence) tags += `<div class="src-tag">⏳ <b>When</b> ${s.occurrence}</div>`;
        if (s.character)  tags += `<div class="src-tag">🎨 <b>Character</b> ${s.character}</div>`;
      }

      // Topics chips
      let topicsHtml = '';
      if (isVoice && Array.isArray(s.topics) && s.topics.length) {
        topicsHtml = `<div class="src-topics">${s.topics.map(t => `<div class="topic-chip">${t}</div>`).join('')}</div>`;
      }

      // Quote
      const quoteHtml = (isVoice && s.quote)
        ? `<div class="src-quote">${s.quote}</div>` : '';

      html += `
        <div class="src-card">
          <div class="src-card-top">
            <div class="src-icon">${s.icon || '🔊'}</div>
            <div class="src-main">
              <div class="src-header">
                <div class="src-name">${s.name}</div>
                <div class="src-badge ${badge}">${label}</div>
              </div>
              <div class="src-desc">${s.description || ''}</div>
              ${tags ? `<div class="src-tags">${tags}</div>` : ''}
            </div>
          </div>
          ${topicsHtml}
          ${quoteHtml}
        </div>`;
    });
  }

  if (!html) { showAiFallback('No distinct sources identified.'); return; }
  $('aiContent').innerHTML = html;
}

function showAiFallback(msg) {
  $('aiContent').innerHTML = `
    <div class="ai-item">
      <div class="ai-icon">ℹ️</div>
      <div class="ai-info">
        <div class="ai-name">AI Analysis Unavailable</div>
        <div class="ai-desc">${msg}</div>
      </div>
    </div>`;
}
