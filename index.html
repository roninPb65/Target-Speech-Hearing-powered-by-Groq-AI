<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TGH - Target Speech Hearing</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 800px;
            width: 100%;
            padding: 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 1.1em;
        }

        .api-key-section {
            margin-bottom: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .api-key-section label {
            display: block;
            margin-bottom: 10px;
            color: #333;
            font-weight: 600;
        }

        .api-key-section input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        .api-key-section input:focus {
            outline: none;
            border-color: #667eea;
        }

        .api-key-section small {
            display: block;
            margin-top: 8px;
            color: #666;
        }

        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 30px;
        }

        button {
            padding: 15px 30px;
            font-size: 1.1em;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-record {
            background: #667eea;
            color: white;
        }

        .btn-record:hover:not(:disabled) {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-record.recording {
            background: #ef4444;
            animation: pulse 1.5s infinite;
        }

        .btn-stop {
            background: #f59e0b;
            color: white;
        }

        .btn-stop:hover:not(:disabled) {
            background: #d97706;
            transform: translateY(-2px);
        }

        .btn-clear {
            background: #6b7280;
            color: white;
        }

        .btn-clear:hover:not(:disabled) {
            background: #4b5563;
            transform: translateY(-2px);
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.7;
            }
        }

        .status {
            text-align: center;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 10px;
            font-weight: 600;
        }

        .status.idle {
            background: #e5e7eb;
            color: #4b5563;
        }

        .status.recording {
            background: #fee2e2;
            color: #dc2626;
        }

        .status.processing {
            background: #fef3c7;
            color: #d97706;
        }

        .status.ready {
            background: #d1fae5;
            color: #059669;
        }

        .audio-visualizer {
            height: 100px;
            background: #f8f9fa;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .visualizer-bars {
            display: flex;
            align-items: center;
            gap: 3px;
            height: 100%;
        }

        .bar {
            width: 4px;
            background: linear-gradient(to top, #667eea, #764ba2);
            border-radius: 2px;
            transition: height 0.1s;
        }

        .transcription-section {
            margin-top: 30px;
        }

        .transcription-section h3 {
            color: #333;
            margin-bottom: 15px;
        }

        .transcription-box {
            background: #f8f9fa;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            padding: 20px;
            min-height: 150px;
            max-height: 300px;
            overflow-y: auto;
            line-height: 1.6;
            color: #333;
            white-space: pre-wrap;
        }

        .transcription-box:empty::before {
            content: "Your transcription will appear here...";
            color: #9ca3af;
            font-style: italic;
        }

        .model-selector {
            margin-bottom: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .model-selector label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }

        .model-selector select {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
        }

        .error-message {
            background: #fee2e2;
            color: #dc2626;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }

        .error-message.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎯 TGH</h1>
            <p class="subtitle">Target Speech Hearing powered by Groq AI</p>
        </div>

        <div class="api-key-section">
            <label for="apiKey">Groq API Key</label>
            <input 
                type="password" 
                id="apiKey" 
                placeholder="Enter your Groq API key (gsk_...)"
                value="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"
            >
            <small>Get your free API key at <a href="https://console.groq.com" target="_blank">console.groq.com</a></small>
        </div>

        <div class="model-selector">
            <label for="modelSelect">Transcription Model</label>
            <select id="modelSelect">
                <option value="whisper-large-v3">Whisper Large v3 (Best Quality)</option>
                <option value="whisper-large-v3-turbo">Whisper Large v3 Turbo (Faster)</option>
                <option value="distil-whisper-large-v3-en">Distil Whisper (English Only - Fast)</option>
            </select>
        </div>

        <div class="error-message" id="errorMessage"></div>

        <div class="status idle" id="status">Ready to record</div>

        <div class="audio-visualizer" id="visualizer">
            <div class="visualizer-bars" id="visualizerBars"></div>
        </div>

        <div class="controls">
            <button class="btn-record" id="recordBtn">
                <span id="recordIcon">🎙️</span>
                <span id="recordText">Start Recording</span>
            </button>
            <button class="btn-stop" id="stopBtn" disabled>
                <span>⏹️</span>
                <span>Stop</span>
            </button>
            <button class="btn-clear" id="clearBtn">
                <span>🗑️</span>
                <span>Clear</span>
            </button>
        </div>

        <div class="transcription-section">
            <h3>Transcription</h3>
            <div class="transcription-box" id="transcriptionBox"></div>
        </div>
    </div>

    <script>
        let mediaRecorder;
        let audioChunks = [];
        let audioContext;
        let analyser;
        let animationFrame;
        let stream;

        const recordBtn = document.getElementById('recordBtn');
        const stopBtn = document.getElementById('stopBtn');
        const clearBtn = document.getElementById('clearBtn');
        const status = document.getElementById('status');
        const transcriptionBox = document.getElementById('transcriptionBox');
        const apiKeyInput = document.getElementById('apiKey');
        const modelSelect = document.getElementById('modelSelect');
        const errorMessage = document.getElementById('errorMessage');
        const visualizerBars = document.getElementById('visualizerBars');

        // Create visualizer bars
        for (let i = 0; i < 50; i++) {
            const bar = document.createElement('div');
            bar.className = 'bar';
            bar.style.height = '5px';
            visualizerBars.appendChild(bar);
        }

        // Load API key from localStorage
        const savedApiKey = localStorage.getItem('groq_api_key');
        if (savedApiKey) {
            apiKeyInput.value = savedApiKey;
        }

        // Save API key to localStorage
        apiKeyInput.addEventListener('change', () => {
            localStorage.setItem('groq_api_key', apiKeyInput.value);
        });

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.add('show');
            setTimeout(() => {
                errorMessage.classList.remove('show');
            }, 5000);
        }

        function updateStatus(text, className) {
            status.textContent = text;
            status.className = `status ${className}`;
        }

        function visualizeAudio() {
            if (!analyser) return;

            const dataArray = new Uint8Array(analyser.frequencyBinCount);
            analyser.getByteFrequencyData(dataArray);

            const bars = visualizerBars.children;
            const step = Math.floor(dataArray.length / bars.length);

            for (let i = 0; i < bars.length; i++) {
                const value = dataArray[i * step];
                const height = (value / 255) * 80 + 5;
                bars[i].style.height = `${height}px`;
            }

            animationFrame = requestAnimationFrame(visualizeAudio);
        }

        recordBtn.addEventListener('click', async () => {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                
                // Setup audio context for visualization
                audioContext = new AudioContext();
                const source = audioContext.createMediaStreamSource(stream);
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 256;
                source.connect(analyser);
                
                visualizeAudio();

                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];

                mediaRecorder.ondataavailable = (event) => {
                    audioChunks.push(event.data);
                };

                mediaRecorder.onstop = async () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    await transcribeAudio(audioBlob);
                    
                    // Stop all tracks
                    stream.getTracks().forEach(track => track.stop());
                    
                    // Stop visualization
                    if (animationFrame) {
                        cancelAnimationFrame(animationFrame);
                    }
                    
                    // Reset visualizer
                    const bars = visualizerBars.children;
                    for (let bar of bars) {
                        bar.style.height = '5px';
                    }
                };

                mediaRecorder.start();
                updateStatus('Recording... Speak now!', 'recording');
                recordBtn.classList.add('recording');
                recordBtn.disabled = true;
                stopBtn.disabled = false;

            } catch (error) {
                showError('Error accessing microphone: ' + error.message);
                updateStatus('Error - Check microphone permissions', 'idle');
            }
        });

        stopBtn.addEventListener('click', () => {
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
                updateStatus('Processing audio...', 'processing');
                recordBtn.classList.remove('recording');
                recordBtn.disabled = false;
                stopBtn.disabled = true;
            }
        });

        clearBtn.addEventListener('click', () => {
            transcriptionBox.textContent = '';
            updateStatus('Ready to record', 'idle');
        });

        async function transcribeAudio(audioBlob) {
            const apiKey = apiKeyInput.value.trim();
            
            if (!apiKey) {
                showError('Please enter your Groq API key');
                updateStatus('Ready to record', 'idle');
                return;
            }

            try {
                const formData = new FormData();
                formData.append('file', audioBlob, 'audio.webm');
                formData.append('model', modelSelect.value);
                formData.append('response_format', 'json');
                formData.append('language', 'en');

                const response = await fetch('https://api.groq.com/openai/v1/audio/transcriptions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: formData
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error?.message || 'Transcription failed');
                }

                const result = await response.json();
                
                if (result.text) {
                    const timestamp = new Date().toLocaleTimeString();
                    const newTranscription = `[${timestamp}] ${result.text}\n\n`;
                    transcriptionBox.textContent += newTranscription;
                    transcriptionBox.scrollTop = transcriptionBox.scrollHeight;
                    updateStatus('Transcription complete!', 'ready');
                } else {
                    showError('No transcription received');
                    updateStatus('Ready to record', 'idle');
                }

            } catch (error) {
                showError('Transcription error: ' + error.message);
                updateStatus('Error - Try again', 'idle');
                console.error('Transcription error:', error);
            }
        }

        // Check browser support
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            showError('Your browser does not support audio recording');
        }
    </script>
</body>
</html>
